            <form id="contact-form" onsubmit="handleFormSubmit(event)" class="space-y-4 sm:space-y-5">

                  <input type="email" id="contact_email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-base sm:text-sm text-white placeholder-slate-500 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500 transition-colors" placeholder="service@yaoxin.com.tw">

                <span>送出免費諮詢申請</span>
              </button>

              <div id="form-success-msg" class="hidden p-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-center text-sm font-semibold">
                ✓ 訊息已成功送出！曜昕顧問團隊將儘速與您聯繫。
