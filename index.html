    // 載入外部 HTML 元件 (header & footer)
    async function loadComponents() {
      try {
        // 解決伺服器端渲染(SSR)或特定環境找不到網域的問題，如果是純前端本地開發，可保持相對路徑
        // 如果在 Node/SSR 環境，請確保補上完整網址，例如：const baseUrl = 'http://localhost:3000/';
        const baseUrl = ''; 

        // 1. 修正 footer.html 變成 footer.html
        const [headerRes, footerRes] = await Promise.all([
          fetch(`${baseUrl}header.html`),
          fetch(`${baseUrl}footer.html`) 
        ]);

        // 2. 處理 Header 載入
        if (headerRes.ok) {
          document.getElementById('header-container').innerHTML = await headerRes.text();
        } else {
          // 修正：將 response 改為 headerRes，並移除未定義的 filePath
          document.getElementById('header-container').innerHTML = 
            `<div style="color: red; padding: 10px; text-align: center;">頁首元件載入失敗 (HTTP ${headerRes.status})</div>`;
          throw new Error(`HTTP 錯誤！header 狀態碼: ${headerRes.status}`);
        }

        // 3. 處理 Footer 載入
        if (footerRes.ok) {
          document.getElementById('footer-container').innerHTML = await footerRes.text();
        } else {
          // 修正：原本誤寫成 header-container，改回 footer-container
          document.getElementById('footer-container').innerHTML = 
            `<div style="color: red; padding: 10px; text-align: center;">頁尾元件載入失敗 (HTTP ${footerRes.status})</div>`;
          throw new Error(`HTTP 錯誤！footer 狀態碼: ${footerRes.status}`);
        }

        // 元件載入後重新初始化 Lucide 圖示與選單觸發事件
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof initMobileMenu === 'function') initMobileMenu();

      } catch (err) {
        // 建議將註解打開，這樣有其他錯誤時主控台才看得到提示
        console.error('載入頁首頁尾時發生錯誤:', err);
      }
    }

   
    // 初始化手機版導覽選單事件
    function initMobileMenu() {
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');

      if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });

        mobileNavLinks.forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
          });
        });
      }
    }

    // 當 DOM 準備完畢時執行組件載入
    document.addEventListener('DOMContentLoaded', () => {
      loadComponents();
    });

    //動態按鈕換頁
    function loadmain(event) {
      // 1. 阻止按鈕的預設換頁行為
      event.preventDefault(); 
   
      // 2. 取得要插入內容的 <main> 容器
      const mainContent = document.getElementById('main-content');
      
      // Get the ID from the clicked element
      let  pageUrl = '';
      if (typeof event.target.id !== 'undefined')  {
        console.log('targetId:',event.target.id.);
        pageUrl=event.target.id.replace('load-','');
        console.log('pageUrl:',pageUrl);
        
        // 3. 使用 Fetch API 非同步讀取同資料夾底下的 services.html
        fetch(`${pageUrl}.html`)
          .then(response => {
              if (!response.ok) {
                  throw new Error('網頁載入失敗');
              }
              return response.text(); // 將檔案內容轉為文字
          })
          .then(htmlData => {
              // 4. 將讀取到的 HTML 內容塞進 <main> 標籤中
              mainContent.innerHTML = htmlData;
          })
          .catch(error => {
              console.error('發生錯誤:', error);
              mainContent.innerHTML = '<p>內容載入失敗，請稍後再試。</p>';
          });

      }else {
         console.error('發生錯誤:找不到pageUrl',event.target.id);
      } 

     
    }

      const ans = document.getElementById(`faq-ans-${qNum}`);

      if (ans.style.display === 'none' || ans.style.display === '') {
        ans.style.display = 'block';

      } else {
        ans.style.display = 'none';

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('form-submit-btn');
      const successMsg = document.getElementById('form-success-msg');
      const phoneInput = document.getElementById('contact_phone');

      if (!btn) return;

      const rawPhone = phoneInput?.value || '';
      const cleanedPhone = rawPhone.replace(/[\s\-\(\)]/g, '');
      const taiwanPhoneRegex = /^(09\d{8}|0\d{8,9})$/;

      if (!taiwanPhoneRegex.test(cleanedPhone)) {
        showToast('請輸入有效的台灣聯絡電話（例：0912-345-678 或 02-2345-6789）', 'warning');
        if (phoneInput) phoneInput.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 送出中...`;
      if (window.lucide) lucide.createIcons();

      const payload = {
        company: document.getElementById('company_name')?.value || '',
        name: document.getElementById('contact_name')?.value || '',
        phone: document.getElementById('contact_phone')?.value || '',
        email: document.getElementById('contact_email')?.value || '',
        service: document.getElementById('service_type')?.value || '',
        desc: document.getElementById('project_desc')?.value || '',
        submittedAt: new Date().toISOString()
      };

      try {
        await fetch(currentApiEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        btn.classList.add('hidden');
        if (successMsg) successMsg.classList.remove('hidden');
        showToast('諮詢表單已成功送出！', 'success');
      } catch (err) {
        console.error("發送失敗:", err);
        btn.classList.add('hidden');
        if (successMsg) successMsg.classList.remove('hidden');
      }
    }
    function showToast(message, type = 'warning') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast-anim pointer-events-auto p-4 rounded-xl border shadow-xl flex items-center justify-between gap-3 text-xs sm:text-sm font-semibold ${
        type === 'warning' ? 'bg-amber-950 border-amber-500/50 text-amber-200' : 'bg-emerald-950 border-emerald-500/50 text-emerald-200'
      }`;
      
      toast.innerHTML = `
        <div class="flex items-center gap-2">
          <i data-lucide="${type === 'warning' ? 'alert-circle' : 'check-circle-2'}" class="w-5 h-5 shrink-0"></i>
          <span>${message}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white p-1">✕</button>
      `;

      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4000);
    }
  </script>

</body>
</html>
